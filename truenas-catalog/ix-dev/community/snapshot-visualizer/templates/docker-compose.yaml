{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.snapshot_visualizer_container_name, "image") %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/healthz", "busybox": true}) %}

{% do c1.add_extra_host("host.docker.internal", "host-gateway") %}

{% do c1.environment.add_env("SNAPVIZ_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("SNAPVIZ_SOURCE", values.snapshot_visualizer.source) %}
{% do c1.environment.add_env("SNAPVIZ_CACHE_SECONDS", values.snapshot_visualizer.cache_minutes * 60) %}
{% do c1.environment.add_env("SNAPVIZ_ALLOW_IMPORT", values.snapshot_visualizer.allow_import) %}
{% do c1.environment.add_env("SNAPVIZ_ALLOW_DELETE", values.snapshot_visualizer.allow_delete) %}
{% if values.snapshot_visualizer.source == "truenas" %}
  {% do c1.environment.add_env("TRUENAS_HOST", values.snapshot_visualizer.truenas_host) %}
  {% do c1.environment.add_env("TRUENAS_API_KEY", values.snapshot_visualizer.api_key) %}
  {% do c1.environment.add_env("TRUENAS_VERIFY_TLS", values.snapshot_visualizer.verify_tls) %}
{% endif %}
{% do c1.environment.add_user_envs(values.snapshot_visualizer.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
